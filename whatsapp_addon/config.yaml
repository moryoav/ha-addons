name: WhatsApp
version: 3.2.0
slug: whatsapp_addon
description: WhatsApp messaging and AI voice calls for Home Assistant
url: https://github.com/moryoav/ha-addons/tree/main/whatsapp_addon
image: ghcr.io/moryoav/whatsapp-addon
homeassistant_api: true
hassio_api: true
ingress: true
ingress_entry: voice/
panel_icon: mdi:whatsapp
panel_title: WhatsApp
discovery:
  - whatsapp
arch:
  - aarch64
  - amd64
init: false
map:
  - type: homeassistant_config
    read_only: true
    path: /config
  - type: media
    read_only: false
options:
  clients:
    - default
  log_level: info
  inbox_clients: []
  voice_calls:
    calling_account: ''
    allowed_callers: []
    agent_id: ''
    voice: gleam
    max_call_seconds: 300
    greeting_mode: random
    greeting_text: ''
    automatic_hangup: true
    record_calls: false
    recording_retention_days: 30
    advanced:
      audio_codec: opus
      playback_buffer_ms: 180
schema:
  clients:
    - str
  log_level: list(info|debug)
  inbox_clients:
    - str
  voice_calls:
    calling_account: str
    allowed_callers:
      - str
    agent_id: str
    voice: list(gleam|meridian|marin|cedar|shimmer|alloy|ash|ballad|coral|echo|sage|verse|quartz|ripple|vesper|willow|stone|bossa|tempo|beacon|delta|cinder)
    max_call_seconds: int(60,900)
    greeting_mode: list(random|fixed|disabled)
    greeting_text: str
    automatic_hangup: bool
    record_calls: bool
    recording_retention_days: int(1,365)
    advanced:
      audio_codec: list(opus|mlow)
      playback_buffer_ms: int(120,1500)
  download_media: bool?
  media_retention_hours: int(1,720)?
  media_max_file_mb: int(1,1024)?
  media_max_storage_mb: int(1,102400)?
