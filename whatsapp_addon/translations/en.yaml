---
configuration:
  download_media:
    name: Download incoming media
    description: >-
      Automatically download and decrypt incoming attachments into unique
      temporary files and include their path and link in message events.
      Update both the add-on and integration to 2.0.0 first. Applies to all
      sessions and chats. Use the saved files in your Home Assistant automations.
  media_retention_hours:
    name: Media retention (hours)
    description: >-
      Keep each new attachment for this many hours after its download completes.
      Default 24. Existing files keep their original expiry. Cleanup also runs
      when downloads are disabled and catches up after a restart.
  media_max_file_mb:
    name: Maximum attachment size (MiB)
    description: Maximum decrypted size of one attachment. Default 64 MiB.
  media_max_storage_mb:
    name: Media storage budget (MiB)
    description: >-
      Total attachment-content budget. Default 1024 MiB. Must be at least the
      maximum attachment size. Active downloads reserve the maximum file size.
      Rejects new downloads instead of removing unexpired files when full.
  clients:
    name: WhatsApp sessions
    description: Session names that can be used as clientId values in Home Assistant actions.
  api_token:
    name: API token
    description: Optional bearer-safe token (A-Z, a-z, 0-9, -._~+/, then optional = padding; maximum 512 characters). Use random hex or URL-safe Base64. Restart the add-on and reload the integration after changing it. Leave unset for internal-network compatibility.
  log_level:
    name: Log level
    description: Use info for normal operation or debug for additional privacy-safe runtime diagnostics while investigating a problem.
  decryption_diagnostics:
    name: Decryption Diagnostics
    description: For internal debugging purposes only. Keep this switched off during normal operation.
  experimental_lid_sender_receipts:
    name: Experimental LID sender receipts
    description: >-
      Disabled by default. Tests supplemental delivery receipts for successfully
      decrypted own-device LID messages to investigate replay/decryption storms.
      Does not mark messages as read or reset pairing. Leave off unless testing
      this issue. Save and restart the add-on after changing this switch.
