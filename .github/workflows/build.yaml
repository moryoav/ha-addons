---
name: Build add-on image

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
  workflow_call:
    inputs:
      publish_latest:
        description: Also publish the latest image tag
        type: boolean
        default: false

env:
  ADDON_PATH: whatsapp_addon
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: whatsapp-addon

permissions:
  contents: read

jobs:
  version:
    name: Read add-on version
    runs-on: ubuntu-latest
    env:
      PUBLISH_LATEST: ${{ inputs.publish_latest }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tags: ${{ steps.version.outputs.image_tags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read version from config.yaml
        id: version
        shell: bash
        run: |
          version="$(grep -E '^version:' "${ADDON_PATH}/config.yaml" \
            | head -n 1 \
            | sed -E 's/^version:[[:space:]]*"?([^"]+)"?/\1/')"
          if [ -z "${version}" ]; then
            echo "Could not read version from ${ADDON_PATH}/config.yaml" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && \
             [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Add-on version ${version} does not match ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          {
            echo "image_tags<<EOF"
            echo "${version}"
            if [ "${GITHUB_EVENT_NAME}" = "release" ] || \
               [ "${PUBLISH_LATEST}" = "true" ]; then
              echo "latest"
            else
              echo "${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  init:
    name: Initialize build matrix
    needs: version
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs:
      - version
      - init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to container registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22  # v4.1.0
        with:
          cosign-release: v2.5.3

      - name: Prepare image tags and creation time
        id: metadata
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAGS: ${{ needs.version.outputs.image_tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=("${IMAGE}:${tag}")
          done <<< "$IMAGE_TAGS"
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "created=$(date --rfc-3339=seconds --utc)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: ${{ env.ADDON_PATH }}
          file: ${{ env.ADDON_PATH }}/Dockerfile
          pull: true
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.version.outputs.version }}
          labels: |
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=app
            io.hass.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          outputs: type=image,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true
          provenance: mode=max
          # Combining registry-inline and GHA imports caused cache misses in the
          # isolated benchmark. Reuse app and native layers from GHA only.
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}-rust
          cache-to: |
            type=inline
            type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Sign per-architecture image
        shell: bash
        env:
          IMAGE_REF: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          for attempt in {1..5}; do
            if cosign sign --yes "$IMAGE_REF"; then
              echo "Signed: $IMAGE_REF"
              exit 0
            fi
            echo "Signing attempt $attempt failed, retrying..."
            sleep "$((2 ** attempt))"
          done
          echo "::error::Failed to sign image $IMAGE_REF"
          exit 1

      # Keep this scope rooted at Rust after the app exporter updates it, so
      # a release rerun can also reuse the tag's cache on the same ref.
      - name: Export native Rust cache for release reruns
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ADDON_PATH }}
          target: builder
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.arch }}-rust
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-rust

  manifest:
    name: Publish multi-arch manifest
    needs:
      - version
      - init
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.version.outputs.image_tags }}
