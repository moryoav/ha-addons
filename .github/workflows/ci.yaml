---
name: Add-on CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ADDON_PATH: whatsapp_addon

jobs:
  lint-addon:
    name: Add-on metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run add-on linter
        uses: frenck/action-addon-linter@v2.21.0
        with:
          path: "./${{ env.ADDON_PATH }}"

  lint-dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: "./${{ env.ADDON_PATH }}/Dockerfile"
          ignore: DL3018

  lint-json:
    name: JSON
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate JSON files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            jq empty "${file}"
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

  lint-markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  lint-shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -s bash

  lint-yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run YAMLLint
        uses: frenck/action-yamllint@v1.5.0

  build-addon:
    name: Build add-on (${{ matrix.arch }})
    needs:
      - lint-addon
      - lint-dockerfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build add-on image
        run: >-
          docker buildx build
          --platform=${{ matrix.platform }}
          --build-arg BUILD_ARCH=${{ matrix.arch }}
          --build-arg BUILD_VERSION=ci
          --tag whatsapp-addon:ci-${{ matrix.arch }}
          --load
          "${ADDON_PATH}"

      - name: Verify packaged Baileys version
        run: >-
          docker run --rm
          --platform=${{ matrix.platform }}
          --entrypoint node
          whatsapp-addon:ci-${{ matrix.arch }}
          -e "(async()=>{const app=require('/package.json');
          const installed=require(
          '/node_modules/@whiskeysockets/baileys/package.json');
          if(installed.version!==app.dependencies['@whiskeysockets/baileys'])
          throw new Error('Unexpected Baileys version');
          const baileys=await import('@whiskeysockets/baileys');
          if(typeof baileys.default!=='function')
          throw new Error('Baileys socket export is unavailable')})()
          .catch(error=>{console.error(error);process.exitCode=1})"

      - name: Smoke-test AppArmor startup permissions
        if: matrix.arch == 'amd64'
        run: |
          test "$(docker image inspect \
            --format '{{json .Config.Entrypoint}}' \
            "whatsapp-addon:ci-${{ matrix.arch }}")" = '["/init"]'
          smoke_cache="$(mktemp -d)"
          smoke_config="${smoke_cache}/addons.self.options.config.cache"
          chmod 0700 "${smoke_cache}"
          printf '%s' '{"log_level":"info"}' > "${smoke_config}"
          chmod 0600 "${smoke_config}"
          cleanup() {
            sudo apparmor_parser --remove \
              "${ADDON_PATH}/apparmor.txt" || true
            rm -f -- "${smoke_config}"
            rmdir -- "${smoke_cache}"
          }
          trap cleanup EXIT
          sudo apparmor_parser --replace "${ADDON_PATH}/apparmor.txt"
          timeout --signal=TERM 30s docker run --rm \
            --security-opt apparmor=whatsapp_addon \
            --mount \
            "type=bind,source=${smoke_cache},target=/tmp/.bashio,readonly" \
            "whatsapp-addon:ci-${{ matrix.arch }}" \
            /usr/bin/node -e \
            "(async()=>{const fs=require('node:fs');
            const dns=require('node:dns').promises;
            const profile=fs.readFileSync('/proc/self/attr/current','utf8');
            if(!profile.includes('whatsapp_addon//node'))
            throw new Error('Node child profile is inactive');
            let writeDenied=false;
            try{fs.appendFileSync('/package.json','x')}
            catch(error){writeDenied=['EACCES','EPERM'].includes(error.code)}
            if(!writeDenied)throw new Error('Packaged files are writable');
            fs.readFileSync('/etc/ssl/certs/ca-certificates.crt');
            await dns.lookup('localhost');
            const path='/tmp/apparmor-smoke';
            fs.writeFileSync(path,'ok');fs.unlinkSync(path);
            const baileys=await import('@whiskeysockets/baileys');
            if(typeof baileys.default!=='function')
            throw new Error('Baileys unavailable')})()
            .catch(error=>{console.error(error);process.exitCode=1})"
