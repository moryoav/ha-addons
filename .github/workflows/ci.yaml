---
name: Add-on CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ADDON_PATH: whatsapp_addon

jobs:
  lint-addon:
    name: Add-on metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run add-on linter
        uses: frenck/action-addon-linter@v2.21.0
        with:
          path: "./${{ env.ADDON_PATH }}"

  lint-dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: "./${{ env.ADDON_PATH }}/Dockerfile"
          ignore: DL3018

  lint-json:
    name: JSON
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate JSON files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            jq empty "${file}"
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

  lint-markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  lint-shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -s bash

  lint-yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run YAMLLint
        uses: frenck/action-yamllint@v1.5.0

  build-addon:
    name: Build add-on (${{ matrix.arch }})
    needs:
      - lint-addon
      - lint-dockerfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build add-on image
        run: >-
          docker buildx build
          --platform=${{ matrix.platform }}
          --build-arg BUILD_ARCH=${{ matrix.arch }}
          --build-arg BUILD_VERSION=ci
          --tag whatsapp-addon:ci-${{ matrix.arch }}
          --load
          "${ADDON_PATH}"

      - name: Verify packaged Baileys version
        run: >-
          docker run --rm
          --platform=${{ matrix.platform }}
          --entrypoint node
          whatsapp-addon:ci-${{ matrix.arch }}
          -e "(async()=>{const app=require('/package.json');
          const installed=require(
          '/node_modules/@whiskeysockets/baileys/package.json');
          if(installed.version!==app.dependencies['@whiskeysockets/baileys'])
          throw new Error('Unexpected Baileys version');
          const baileys=await import('@whiskeysockets/baileys');
          if(typeof baileys.default!=='function')
          throw new Error('Baileys socket export is unavailable')})()
          .catch(error=>{console.error(error);process.exitCode=1})"

      - name: Smoke-test AppArmor startup and health probe
        if: matrix.arch == 'amd64'
        run: |
          test "$(docker image inspect \
            --format '{{json .Config.Entrypoint}}' \
            "whatsapp-addon:ci-${{ matrix.arch }}")" = '["/init"]'
          smoke_network=""
          smoke_supervisor=""
          smoke_target=""
          cleanup() {
            exit_code=$?
            if [[ -n "${smoke_target}" ]]; then
              docker rm --force "${smoke_target}" >/dev/null 2>&1 || true
            fi
            if [[ -n "${smoke_supervisor}" ]]; then
              docker rm --force "${smoke_supervisor}" >/dev/null 2>&1 || true
            fi
            if [[ -n "${smoke_network}" ]]; then
              docker network rm "${smoke_network}" >/dev/null 2>&1 || true
            fi
            sudo apparmor_parser --remove \
              "${ADDON_PATH}/apparmor.txt" || true
            trap - EXIT
            exit "${exit_code}"
          }
          trap cleanup EXIT
          sudo apparmor_parser --replace "${ADDON_PATH}/apparmor.txt"
          smoke_network="whatsapp-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker network create --internal "${smoke_network}" >/dev/null
          smoke_supervisor="$(docker run --detach \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --no-healthcheck \
            --rm \
            --network "${smoke_network}" \
            --network-alias supervisor \
            --entrypoint /usr/bin/node \
            "whatsapp-addon:ci-${{ matrix.arch }}" \
            -e "const http=require('node:http');
            const responses=new Map([
            ['/supervisor/ping',{result:'ok',data:{}}],
            ['/addons/self/info',{result:'ok',data:{name:'WhatsApp CI',
            description:'AppArmor startup smoke test',version:'ci',
            update_available:false}}],
            ['/info',{result:'ok',data:{operating_system:'CI',arch:'amd64',
            machine:'generic-x86-64',homeassistant:'ci',supervisor:'ci'}}],
            ['/addons/self/options/config',{result:'ok',
            data:{log_level:'info'}}]]);
            http.createServer((request,response)=>{
            response.setHeader('Content-Type','application/json');
            const body=request.method==='GET'&&responses.get(request.url);
            if(body){response.end(JSON.stringify(body));return}
            response.statusCode=404;
            response.end(JSON.stringify({result:'error',
            message:'Endpoint not mocked'}))}).listen(8080,'0.0.0.0')")"
          mock_ready=false
          for _ in {1..20}; do
            if docker exec "${smoke_supervisor}" curl --fail --silent \
              --max-time 1 \
              http://127.0.0.1:8080/addons/self/options/config \
              | jq --exit-status '.data.log_level == "info"' >/dev/null; then
              mock_ready=true
              break
            fi
            sleep 0.25
          done
          test "${mock_ready}" = true
          smoke_target="whatsapp-target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --name "${smoke_target}" \
            --security-opt apparmor=whatsapp_addon \
            --network "${smoke_network}" \
            --env SUPERVISOR_API=http://supervisor:8080 \
            --env SUPERVISOR_TOKEN=ci \
            "whatsapp-addon:ci-${{ matrix.arch }}" \
            /usr/bin/node -e \
            "(async()=>{const fs=require('node:fs');
            const dns=require('node:dns').promises;
            const profile=fs.readFileSync('/proc/self/attr/current','utf8');
            if(!profile.includes('whatsapp_addon//node'))
            throw new Error('Node child profile is inactive');
            let writeDenied=false;
            try{fs.appendFileSync('/package.json','x')}
            catch(error){writeDenied=['EACCES','EPERM'].includes(error.code)}
            if(!writeDenied)throw new Error('Packaged files are writable');
            fs.readFileSync('/etc/ssl/certs/ca-certificates.crt');
            await dns.lookup('localhost');
            const path='/tmp/apparmor-smoke';
            fs.writeFileSync(path,'ok');fs.unlinkSync(path);
            const baileys=await import('@whiskeysockets/baileys');
            if(typeof baileys.default!=='function')
            throw new Error('Baileys unavailable')})()
            .catch(error=>{console.error(error);process.exitCode=1})"
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --security-opt apparmor=whatsapp_addon \
            --entrypoint /bin/sh \
            "whatsapp-addon:ci-${{ matrix.arch }}" \
            -c 'set -eu
            /usr/bin/node -e "const http=require(\"node:http\");
            http.createServer((request,response)=>{
            if(request.url!==\"/health\"||
            request.headers[\"x-ha-healthcheck\"]!==\"docker\")
            response.statusCode=400;
            response.end()}).listen(3000,\"127.0.0.1\")" &
            server_pid=$!
            trap '\''kill "${server_pid}" 2>/dev/null || true'\'' EXIT
            attempt=0
            while [ "${attempt}" -lt 20 ]; do
              if /healthcheck.sh; then exit 0; fi
              attempt=$((attempt + 1))
              sleep 0.1
            done
            exit 1'
