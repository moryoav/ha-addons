---
name: Tests

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2024.12.0 (minimum)"
            python: "3.12"
            pytest_homeassistant: "0.13.190"
            pytest_cov: "6.0.0"
            pycares: "4.5.0"
          - homeassistant: "2026.7.4 (current stable)"
            python: "3.14"
            pytest_homeassistant: "0.13.348"
            pytest_cov: "7.1.0"
            pycares: "5.0.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install controlled test dependencies
        run: >-
          python -m pip install
          pytest-homeassistant-custom-component==${{ matrix.pytest_homeassistant }}
          pytest-cov==${{ matrix.pytest_cov }}
          pycares==${{ matrix.pycares }}
          tzdata==2026.3

      - name: Run Python tests
        run: >-
          pytest
          --cov=custom_components.whatsapp
          --cov-report=term-missing
          --cov-fail-under=95

  node:
    name: Add-on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20"
          - "24"
    defaults:
      run:
        working-directory: whatsapp_addon
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: whatsapp_addon/package-lock.json

      - name: Install add-on dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Node tests
        run: npm test
