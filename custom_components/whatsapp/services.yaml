send_message:
  fields:
    clientId:
      name: Client ID
      description: The add-on client session to send the message from.
      required: true
      example: default
      selector:
        text:
    to:
      required: true
      example: 12025550123@s.whatsapp.net
      selector:
        text:
    message:
      required: true
      selector:
        choose:
          translation_key: message_type
          choices:
            text:
              selector:
                text:
                  multiline: true
            image:
              selector: &image_video
                object:
                  translation_key: message_media
                  label_field: url
                  fields:
                    url: &media_url
                      required: true
                      selector:
                        text:
                          type: url
                    caption: &media_caption
                      selector:
                        text:
                          multiline: true
            video:
              selector: *image_video
            sticker:
              selector:
                object:
                  translation_key: message_sticker
                  label_field: url
                  fields:
                    url: *media_url
            location:
              selector:
                location:
            audio:
              selector:
                object:
                  translation_key: message_media
                  label_field: url
                  fields:
                    url: *media_url
                    ptt:
                      selector:
                        boolean:
            document:
              selector:
                object:
                  translation_key: message_media
                  label_field: file_name
                  fields:
                    url: *media_url
                    file_name:
                      required: true
                      selector:
                        text:
                    caption: *media_caption
                    mimetype:
                      selector:
                        text:
            poll:
              selector:
                object:
                  translation_key: message_poll
                  label_field: name
                  fields:
                    name:
                      required: true
                      selector:
                        text:
                    values:
                      required: true
                      selector:
                        text:
                          multiple: true
            yaml:
              selector:
                object:
    advanced_send_options:
      collapsed: true
      fields:
        reply_to:
          selector:
            constant:
              label: Use the triggering message
              value: >-
                {{ trigger.event.data if trigger is defined and trigger.platform
                == 'event' and trigger.event.event_type == 'new_whatsapp_message'
                else none }}
        options:
          selector:
            object:

