rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: One coordinator polls app status every 30 seconds. Opt-in inbox delivery uses update hints and a ten-second fallback poll; other events remain pushed.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: HTTP provides authenticated attachment downloads. App data contains private inbox snapshots and recovery archives; media mounts contain decrypted attachments and optional recordings. The read-only config mount supplies the selected OpenAI agent key for voice calls.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Account entities become unavailable when status cannot be read; the app connectivity sensor reports disconnection explicitly.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: Both platforms set PARALLEL_UPDATES to 0 and share one coordinator.
  reauthentication-flow:
    status: exempt
    comment: The app generates its internal API credential and delivers or refreshes it through Supervisor discovery; the integration does not accept or renew credentials, and WhatsApp pairing remains in the app QR flow.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: All three status entity types are useful for connection monitoring and enabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: The status entities use default device-class icons and define no custom icons.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Connection issues are handled during setup and service calls; there are no persistent device repairs to create.
  stale-devices:
    status: done
    comment: Accounts absent from a successful status snapshot can be removed by the user; active accounts and the shared app device cannot be removed.
